version: "3.9"

networks:
  staging_net:
    driver: bridge

services:
  # --------------------------
  # Application Services
  # --------------------------
  hpa-service:
    image: registry.digitalocean.com/stagingenv/hpa-service@sha256:2c2c4044c9386a7c352f1beed3db89dcd1808f11bf7bbd414f09bc967b05f6b9
    platform: linux/amd64
    networks:
      - staging_net

  gdl-website:
    image: registry.digitalocean.com/stagingenv/gdl-website@sha256:9366899785621f314fe349fd67100aef6733f63c0723c10bc30420020f7f935c
    platform: linux/amd64
    networks:
      - staging_net

  saveinvest-service:
    image: registry.digitalocean.com/stagingenv/saveinvest-service@sha256:508f906fb27b5f12c4c9fa6192362112c31b77f37f40d505f2dfe36f473e2afb
    platform: linux/amd64
    networks:
      - staging_net

  bankone-service:
    image: registry.digitalocean.com/stagingenv/bankone-service@sha256:66bfad884ecd85ec5e93b307e665e843dd7505ac27c00feb0f35f8238d918f80
    platform: linux/amd64
    networks:
      - staging_net

  notification-service:
    image: registry.digitalocean.com/stagingenv/notification-service@sha256:5ad9e27b52d42317cdc7e3e99d2f76009fbdb1896eaa0fcecd186390a2af9649
    platform: linux/amd64
    networks:
      - staging_net

  loan-service:
    image: registry.digitalocean.com/stagingenv/loan-service@sha256:067eaccbf20256fbe3f1da45aaf44b8954ec1284d051f92d16bb520ec5678c30
    platform: linux/amd64
    networks:
      - staging_net

  symplus-service:
    image: registry.digitalocean.com/stagingenv/symplus-service@sha256:6d5985a2d1da3883735fd6105cdc65170e1232dc45371b1a1c72b9b437aa51ae
    platform: linux/amd64
    networks:
      - staging_net

  transaction-service:
    image: registry.digitalocean.com/stagingenv/transactions-service@sha256:edf7373b3b298ef85b6148be481ed2ad286afa4ecd97b427ae90f14da74f22b1
    platform: linux/amd64
    networks:
      - staging_net

  user-service:
    image: registry.digitalocean.com/stagingenv/user-service@sha256:71b776268bf9d4922f330e2edeb2c26ef57451020eb9388b11fe11a3c644c852
    platform: linux/amd64
    networks:
      - staging_net

  dms-service:
    image: registry.digitalocean.com/stagingenv/dms-service@sha256:4ea2f56d305622741fc6c8872e4a9c2922aceaa59e90898f155c3deb83934233
    platform: linux/amd64
    networks:
      - staging_net

  account-service:
    image: registry.digitalocean.com/stagingenv/account-service@sha256:aa8496daea257133613fe6464da918f5069878735736e39e5df50af4eec6f523
    platform: linux/amd64
    networks:
      - staging_net

  # --------------------------
  # Nginx Reverse Proxy
  # --------------------------
  nginx-proxy:
    image: nginx:stable
    platform: linux/amd64
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro      # <-- mount full cert folder
      - /etc/nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - user-service
      - account-service
      - transaction-service
      - dms-service
      - hpa-service
      - gdl-website
      - saveinvest-service
      - bankone-service
      - notification-service
      - loan-service
      - symplus-service
    networks:
      - staging_net