version: "3.9"

networks:
  staging_net:
    driver: bridge

services:
  # --------------------------
  # Application Services
  # --------------------------
  hpa-service:
    image: registry.digitalocean.com/stagingenv/hpa-service@sha256:f4bbbcd55bdf45757efc7a3862eedf9d17869de0fc4771106fa70858072210b4
    platform: linux/amd64
    networks:
      - staging_net

  gdl-website:
    image: registry.digitalocean.com/stagingenv/gdl-website@sha256:9366899785621f314fe349fd67100aef6733f63c0723c10bc30420020f7f935c
    platform: linux/amd64
    networks:
      - staging_net

  saveinvest-service:
    image: registry.digitalocean.com/stagingenv/saveinvest-service@sha256:960fa2b3d8569ddcf132fa1e1b176c90ade27dad50502ca5b6f6a92d6bfb2cd1
    platform: linux/amd64
    networks:
      - staging_net

  bankone-service:
    image: registry.digitalocean.com/stagingenv/bankone-service@sha256:faa295620ca489c1e60e29600d714d17e8abf16d58fa09429cf478458e2d9575
    platform: linux/amd64
    networks:
      - staging_net

  notification-service:
    image: registry.digitalocean.com/stagingenv/notification-service@sha256:b8920233c53f8db4168df18b6d11f60455b0dfb6dcb8673d73766b46fa323729
    platform: linux/amd64
    networks:
      - staging_net

  loan-service:
    image: registry.digitalocean.com/stagingenv/loan-service@sha256:1407f3e9b587609ab465d1fb984c16edda7ce7ed6c009cb831435b0ee203cbbe
    platform: linux/amd64
    networks:
      - staging_net

  symplus-service:
    image: registry.digitalocean.com/stagingenv/symplus-service@sha256:d579be895a5d6e42497b0490718874cb623416048042b9757371b9ecb82b727e
    platform: linux/amd64
    networks:
      - staging_net

  transaction-service:
    image: registry.digitalocean.com/stagingenv/transactions-service@sha256:5c2c631aabb1cc230d76e3e234c6629b63a55ca2151361950b55983c7512c040
    platform: linux/amd64
    networks:
      - staging_net

  user-service:
    image: registry.digitalocean.com/stagingenv/user-service@sha256:caccd9670f2eb21f95b4a612df615b94a0e4009f153a8c189c223d6d482948a9
    platform: linux/amd64
    networks:
      - staging_net

  dms-service:
    image: registry.digitalocean.com/stagingenv/dms-service@sha256:3c66d88879acd0665ea0cbcada975f3b2f55938199f15546b342d9928dfe991c
    platform: linux/amd64
    networks:
      - staging_net

  account-service:
    image: registry.digitalocean.com/stagingenv/account-service@sha256:91cbfc34bc253658aab28b9f0241afe699735dad492c9ed0d61a9b9c76dd5b8e
    platform: linux/amd64
    networks:
      - staging_net

  # --------------------------
  # Nginx Reverse Proxy
  # --------------------------
  nginx-proxy:
    image: nginx:stable
    platform: linux/amd64
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro      # <-- mount full cert folder
      - /etc/nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      - user-service
      - account-service
      - transaction-service
      - dms-service
      - hpa-service
      - gdl-website
      - saveinvest-service
      - bankone-service
      - notification-service
      - loan-service
      - symplus-service
    networks:
      - staging_net