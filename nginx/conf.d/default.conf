# ----------------------------------------------------
# STAGING ENVIRONMENT - HTTP + HTTPS
# Domain: api-test.housemoni.ng
# ----------------------------------------------------

# ---------------------------
# HTTP BLOCK — redirect to HTTPS
# ---------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api-test.housemoni.ng;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# ---------------------------
# HTTPS BLOCK — serve staging services
# ---------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-test.housemoni.ng;

    # SSL certificates from Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/api-test.housemoni.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-test.housemoni.ng/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---------------------------
    # PROXY SERVICE ROUTES
    # ---------------------------

    # Common proxy headers for all services
    set $proxy_upstream "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /user-service/ {
        proxy_pass http://staging_test_user-service_1:3080;
    }

    location /account-service/ {
        proxy_pass http://staging_test_account-service_1:3077;
    }

    location /dms-service/ {
        proxy_pass http://staging_test_dms-service_1:3079;
    }

    location /hpa-service/ {
        proxy_pass http://staging_test_hpa-service_1:3090;
    }

    location /gdl-website/ {
        proxy_pass http://staging_test_gdl-website_1:3013;
    }

    location /saveinvest-service/ {
        proxy_pass http://staging_test_saveinvest-service_1:3078;
    }

    location /bankone-service/ {
        proxy_pass http://staging_test_bankone-service_1:3047;
    }

    location /notification-service/ {
        proxy_pass http://staging_test_notification-service_1:3079;
    }

    location /loan-service/ {
        proxy_pass http://staging_test_loan-service_1:3081;
    }

    location /symplus-service/ {
        proxy_pass http://staging_test_symplus-service_1:3011;
    }

    location /transaction-service/ {
        proxy_pass http://staging_test_transaction-service_1:3075;
    }

    # Default fallback
    location / {
        return 404;
    }
}